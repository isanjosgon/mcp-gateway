server:
  host: 0.0.0.0
  port: 8080
  path: /mcp
  allowedOrigins:
    - "http://localhost:3000"
    - "https://platform.openai.com"
    - "https://app.your-domain.com"
  # Requests without an Origin header are allowed by default for non-browser clients.
  # Set to true to reject requests that omit Origin.
  requireOrigin: false

auth:
  mode: apiKey
  apiKeys:
    - id: "local-dev-key"
      # Use keyHash in production. Plain key is convenient for local development.
      # Plain keys can use ${ENV_VAR} placeholders resolved at startup.
      key: "dev_key_1"
      # keyHash: "sha256:REPLACE_WITH_SHA256_HEX_OF_THE_API_KEY"
      tenant: "client"
      client: "local-dev"

rateLimit:
  # Set REDIS_URL=redis://... to share limits across gateway instances.
  # Without REDIS_URL, the gateway uses in-memory rate limit buckets.
  # Override keyPrefix with RATE_LIMIT_KEY_PREFIX to separate environments.
  keyPrefix: "mcp-gateway"
  defaultRpm: 600
  byMethod:
    "tools/call": 120

policy:
  default: deny
  rules:
    - subject:
        tenant: "client"
        client: "local-dev"
      allow:
        methods:
          - "initialize"
          - "notifications/initialized"
          - "notifications/cancelled"
          - "ping"
          - "tools/list"
          - "tools/call"
          - "resources/list"
          - "resources/read"
          - "prompts/list"
          - "prompts/get"
        tools: ["*"]
        resources: ["*"]
        prompts: ["*"]

upstreams:
  - name: mcp-local
    type: http
    url: "http://mcp-dummy:9000/mcp"
    timeoutMs: 30000
    # Optional upstream authentication. This is generated by the gateway and is
    # separate from the client credentials used to authenticate at the gateway.
    # auth:
    #   type: apiKey
    #   apiKey:
    #     header: "Authorization"
    #     value: "Api-Key ${MCP_LOCAL_API_KEY}"

  # REST upstream: the gateway serves these tools itself and turns each
  # tools/call into a REST request. In the repo docker-compose.yml,
  # REST_BASE_URL=http://mcp-dummy:9000 (mcp-dummy serves GET/POST /items). If REST_BASE_URL is missing or empty the
  # gateway still starts; this upstream then lists no tools and tools/call
  # returns isError "upstream not configured".
  - name: rest-example
    type: rest
    baseUrl: "${REST_BASE_URL}"
    timeoutMs: 6000
    # auth:
    #   type: apiKey
    #   apiKey:
    #     header: "Authorization"
    #     value: "Api-Key ${REST_API_KEY}"
    tools:
      - name: example_get_item
        description: "Get an item by id"
        inputSchema:
          type: object
          properties:
            id: { type: string }
            fields: { type: string }
          required: ["id"]
        annotations: { title: "Item", readOnlyHint: true }
        request:
          method: GET
          # Placeholders resolve against { arguments, _meta } of tools/call.
          # Unused arguments (here "fields") go as query string in GET/DELETE
          # and as JSON body in POST/PUT/PATCH.
          path: "/items/{arguments.id}"
      - name: example_create_item
        description: "Create an item"
        inputSchema:
          type: object
          properties:
            name: { type: string }
            price: { type: number }
          required: ["name"]
          additionalProperties: false
        request:
          method: POST
          path: "/items"

upstreamHeaders:
  # Only these request headers are forwarded to upstream MCP servers.
  # Gateway credentials such as Authorization, X-API-Key, and Api-Key are never forwarded.
  forward:
    - "accept"
    - "content-type"
    - "mcp-session-id"
    - "mcp-protocol-version"
    - "last-event-id"

routing:
  # tools/list merges the tools of all upstreams; every other method
  # (initialize, tools/call...) goes to the first match below, so each tool
  # needs a tools/call rule towards its upstream.
  - match: { method: "tools/call", tool: "example_*" }
    upstream: "rest-example"
  - match: { method: "*" }
    upstream: "mcp-local"

audit:
  enabled: true
  # Environment is resolved from MCP_GATEWAY_ENV, then NODE_ENV, then "development".
  # Use ["*"] to log audit events in all environments.
  environments: ["production", "staging"]

logging:
  level: "info"
  redactKeys:
    - "authorization"
    - "x-api-key"
    - "api-key"
    - "token"
    - "access_token"
    - "password"
    - "secret"
